
name: bagikopi

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_nama: bagikopi
    restart: unless-stopped
    ports:
      - "${APP_PORT:-1106}:80"
    environment:
      APP_NAME: "${APP_NAME:-BagiKopi}"
      APP_ENV: production
      APP_KEY: "${APP_KEY:-base64:Lx5ebnMopG3o6Rklc8wQvEAF6Nh/PevVnRj3QvlPo/A=}"
      APP_DEBUG: "false"
      APP_URL: "http://localhost:${APP_PORT:-8000}"
      APP_LOCALE: "${APP_LOCALE:-en}"
      APP_FALLBACK_LOCALE: "${APP_FALLBACK_LOCALE:-en}"
      APP_FAKER_LOCALE: "${APP_FAKER_LOCALE:-en_US}"
      LOG_CHANNEL: "${LOG_CHANNEL:-stack}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"

      
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT : 3306 
      DB_DATABASE: db_perkoci
      DB_USERNAME: demo_app_db
      DB_PASSWORD: demopass123
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}

 
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local

      BROADCAST_CONNECTION: log
      MAIL_MAILER: "${MAIL_MAILER:-log}"
      MAIL_HOST: "${MAIL_HOST:-127.0.0.1}"
      MAIL_PORT: "${MAIL_PORT:-2525}"
      MAIL_USERNAME: "${MAIL_USERNAME:-null}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-null}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-hello@example.com}"
      MAIL_FROM_NAME: "${APP_NAME:-BagiKopi}"

      VITE_APP_NAME: "${APP_NAME:-BagiKopi}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin123}"
      MIDTRANS_MERCHANT_ID: "${MIDTRANS_MERCHANT_ID:-}"
      MIDTRANS_CLIENT_KEY: "${MIDTRANS_CLIENT_KEY:-}"
      MIDTRANS_SERVER_KEY: "${MIDTRANS_SERVER_KEY:-}"
      MIDTRANS_IS_PRODUCTION: "${MIDTRANS_IS_PRODUCTION:-false}"
    volumes:
      - storage_data:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-1234}"
      MYSQL_DATABASE: "${DB_DATABASE:-db_perkoci}"
      TZ: "${TZ:-Asia/Jakarta}"
    volumes:
      - db_data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  db_data:
  storage_data:
